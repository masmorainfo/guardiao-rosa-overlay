<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Guardião da Floresta — presentes</title>
  <style>
    :root { font-family: "Segoe UI", Arial, sans-serif; --alert-right: clamp(12px, 3vw, 40px); --stack-bottom: clamp(16px, 3vh, 32px); --queue-space: clamp(164px, 21vh, 200px); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
    body { display: block; }
    #alert { width: min(84vw, 540px); min-height: 140px; padding: 22px 66px; position: fixed; right: var(--alert-right); bottom: calc(var(--stack-bottom) + var(--queue-space) + 12px); overflow: hidden; border: 2px solid rgba(164, 255, 184, .96); border-radius: 28px; color: #f2fff1; background: linear-gradient(112deg, rgba(4, 34, 22, .97), rgba(8, 92, 53, .95) 52%, rgba(25, 111, 63, .94)); box-shadow: 0 0 42px rgba(48, 255, 120, .48), 0 0 10px rgba(191, 255, 192, .5), inset 0 0 30px rgba(151, 255, 174, .17); text-align: center; opacity: 0; transform: translateX(115%) rotate(4deg); transition: opacity .24s ease, transform .24s cubic-bezier(.2, .8, .25, 1); }
    #alert.visible { opacity: 1; animation: enter-wave .72s cubic-bezier(.18, .82, .2, 1) both, gentle-wave 2s ease-in-out .72s 1; }
    #alert.likes { border-color: rgba(255, 220, 139, .98); color: #fff7e4; background: linear-gradient(112deg, rgba(48, 30, 6, .97), rgba(133, 84, 12, .96) 52%, rgba(179, 126, 28, .95)); box-shadow: 0 0 42px rgba(255, 184, 54, .48), 0 0 12px rgba(255, 226, 160, .58), inset 0 0 30px rgba(255, 220, 139, .18); }
    #alert.likes .kicker { color: #ffe1a2; }
    #alert.likes .message { color: #fff0c8; }
    #alert.likes .leaf { filter: drop-shadow(0 0 8px rgba(255, 211, 112, .76)); }
    #alert::before, #alert::after { content: ""; position: absolute; width: 130px; height: 130px; border: 1px solid rgba(158, 255, 174, .25); border-radius: 50%; }
    #alert::before { top: -75px; left: -44px; }
    #alert::after { bottom: -94px; right: -33px; }
    .kicker { margin: 0 0 8px; color: #a7f3b5; font-size: 15px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .name { margin: 0; font-size: clamp(24px, 4vw, 38px); font-weight: 800; line-height: 1.12; text-shadow: 0 2px 10px rgba(0, 0, 0, .55); }
    .identity { display: flex; align-items: center; justify-content: center; gap: 10px; min-width: 0; }
    #gift-icon { width: 40px; height: 40px; flex: 0 0 40px; object-fit: contain; filter: drop-shadow(0 0 9px rgba(196, 255, 179, .7)); }
    #gift-fallback { flex: 0 0 auto; font-size: 34px; line-height: 1; filter: drop-shadow(0 0 8px rgba(196, 255, 179, .7)); }
    #gift-icon[hidden], #gift-fallback[hidden] { display: none; }
    #alert.likes #gift-fallback { filter: drop-shadow(0 0 10px rgba(255, 218, 126, .9)); }
    .message { margin: 8px 0 0; color: #e0ffd9; font-size: clamp(18px, 2.8vw, 26px); font-weight: 650; }
    .leaf { position: absolute; top: 50%; transform: translateY(-50%); font-size: 40px; filter: drop-shadow(0 0 8px rgba(161, 255, 156, .6)); }
    .leaf.left { left: 13px; animation: leaf-wave 2.4s ease-in-out infinite; }
    .leaf.right { right: 13px; animation: leaf-wave 2.4s ease-in-out .35s infinite reverse; }
    .glint { position: absolute; color: #e1ff9d; opacity: 0; font-size: 18px; text-shadow: 0 0 12px #a4ffaf; pointer-events: none; animation: glint 1.8s ease-in-out .45s 1 both; }
    .glint.one { top: 15px; left: 28%; }
    .glint.two { right: 24%; bottom: 18px; animation-delay: .75s; }
    .sheen { position: absolute; top: -20%; left: -40%; width: 28%; height: 140%; transform: skewX(-18deg); background: linear-gradient(90deg, transparent, rgba(226, 255, 219, .34), transparent); pointer-events: none; animation: sheen-sweep 1.35s ease-out .38s 1 both; }
    @keyframes enter-wave {
      0% { opacity: 0; transform: translateX(115%) rotate(5deg); }
      58% { opacity: 1; transform: translateX(-5%) translateY(-7px) rotate(-2deg); }
      76% { transform: translateX(2.5%) translateY(3px) rotate(1.2deg); }
      90% { transform: translateX(-1%) translateY(-1px) rotate(-.4deg); }
      100% { opacity: 1; transform: translateX(0) translateY(0) rotate(0); }
    }
    @keyframes gentle-wave {
      0%, 100% { transform: translateX(0) translateY(0) rotate(0); }
      28% { transform: translateX(-2px) translateY(-4px) rotate(-.35deg); }
      62% { transform: translateX(1px) translateY(2px) rotate(.25deg); }
    }
    @keyframes leaf-wave {
      0%, 100% { translate: 0 0; rotate: 0deg; }
      50% { translate: 0 -5px; rotate: -7deg; }
    }
    @keyframes glint {
      0%, 100% { opacity: 0; scale: .45; }
      45% { opacity: .95; scale: 1.15; }
    }
    @keyframes sheen-sweep {
      0% { left: -40%; opacity: 0; }
      18% { opacity: 1; }
      100% { left: 125%; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      #alert.visible, .leaf, .glint, .sheen { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      #alert { transition-duration: .01ms; }
    }
    #queue-panel { position: fixed; z-index: 8; right: var(--alert-right); bottom: var(--stack-bottom); width: min(84vw, 540px); max-height: var(--queue-space); padding: 10px 12px; overflow: hidden; border: 1px solid rgba(143, 255, 176, .76); border-radius: 16px; color: #effff1; background: linear-gradient(110deg, rgba(3, 28, 19, .93), rgba(6, 67, 42, .92)); box-shadow: 0 0 22px rgba(48, 255, 120, .2), inset 0 0 18px rgba(124, 255, 157, .08); opacity: 0; visibility: hidden; transform: translateY(8px); transition: opacity .18s ease, transform .18s ease, visibility .18s; }
    #queue-panel.visible { opacity: 1; visibility: visible; transform: translateY(0); }
    #queue-title { margin: 0 0 6px; color: #a7f3b5; font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    #queue-list { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
    #queue-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 7px; min-height: 22px; padding: 2px 6px; border-radius: 7px; background: rgba(184, 255, 194, .08); font-size: 13px; }
    .queue-number { color: #b7ff92; font-size: 11px; font-weight: 800; }
    .queue-name { overflow: hidden; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .queue-count { color: #c7fbd0; font-size: 11px; white-space: nowrap; }
    #status { display: none; position: fixed; z-index: 10; left: 8px; top: 8px; max-width: min(92vw, 520px); max-height: 45vh; padding: 8px 10px; overflow: auto; border-radius: 8px; color: #fff; background: rgba(15, 20, 18, .92); font: 12px/1.45 "Segoe UI", Arial, sans-serif; white-space: pre-wrap; overflow-wrap: anywhere; }
    #status.visible { display: block; }
    #test-tools { display: none; position: fixed; z-index: 11; left: 8px; bottom: 8px; width: min(94vw, 330px); padding: 10px; border: 1px solid #8fffb0; border-radius: 10px; color: #fff; background: rgba(15, 32, 23, .96); font: 13px/1.4 "Segoe UI", Arial, sans-serif; }
    #test-tools.visible { display: block; }
    #test-tools p { margin: 0 0 8px; font-weight: 700; }
    #test-tools button { margin: 2px; padding: 7px 9px; border: 1px solid #73c88d; border-radius: 6px; color: #102719; background: #d9ffe2; cursor: pointer; }
  </style>
</head>
<body>
  <section id="alert" aria-live="polite" aria-atomic="true">
    <span class="leaf left" aria-hidden="true">🌿</span>
    <span class="leaf right" aria-hidden="true">🍃</span>
    <span class="glint one" aria-hidden="true">✦</span>
    <span class="glint two" aria-hidden="true">✧</span>
    <span class="sheen" aria-hidden="true"></span>
    <p class="kicker" id="kicker">A floresta agradece</p>
    <div class="identity">
      <img id="gift-icon" alt="" hidden>
      <span id="gift-fallback" aria-hidden="true">🌿</span>
      <p class="name" id="name"></p>
    </div>
    <p class="message" id="message"></p>
  </section>
  <aside id="queue-panel" aria-live="polite" aria-label="Próximos cinco alertas">
    <p id="queue-title">Próximos alertas</p>
    <ol id="queue-list"></ol>
  </aside>
  <div id="status" role="status"></div>
  <aside id="test-tools" aria-label="Controles de teste">
    <p>Teste local — não envia presentes reais</p>
    <button id="test-15">Testar 15 rosas</button>
    <button id="test-30">Testar 30 rosas</button>
    <button id="test-round-robin">Testar fila alternada</button>
    <button id="test-likes">Testar 1.000 curtidas</button>
    <button id="test-priority">Testar pausa de 10 s</button>
    <button id="test-reset">Reiniciar</button>
  </aside>
  <script type="module">
    import { RoseQueueController } from "./core.mjs?v=16";

    const settings = {
      blockSize: 15,
      lowDiamondValue: 1,
      likeGoal: 1_000,
      highPriorityMinDiamonds: 100,
      highPriorityPauseMs: 10_000,
      alertDurationMs: 3_000,
      alertGapMs: 4_000,
    };
    const controller = new RoseQueueController(settings);
    const card = document.getElementById("alert");
    const name = document.getElementById("name");
    const message = document.getElementById("message");
    const kicker = document.getElementById("kicker");
    const giftIcon = document.getElementById("gift-icon");
    const giftFallback = document.getElementById("gift-fallback");
    const queuePanel = document.getElementById("queue-panel");
    const queueList = document.getElementById("queue-list");
    const status = document.getElementById("status");
    const params = new URLSearchParams(window.location.search);
    const previewMode = params.get("preview") === "1";
    const testMode = params.get("selftest") === "1";
    const debugMode = params.get("debug") === "1" || testMode;
    const testTools = document.getElementById("test-tools");
    let lastId = null;
    let lastQueueSignature = "";
    let socket = null;
    let reconnectTimer = null;
    const recentEvents = [];

    function setStatus(text) {
      if (!debugMode) return;
      status.textContent = [text, ...recentEvents].join("\n");
      status.classList.add("visible");
    }

    function safeDiagnostic(envelope) {
      const redact = (value) => {
        if (Array.isArray(value)) return value.map(redact);
        if (!value || typeof value !== "object") return value;
        return Object.fromEntries(Object.entries(value).map(([key, child]) => [
          key,
          /user.?id|unique.?id|display.?id|username|nickname|profile.?pictur|avatar|comment|tikfinity.?user.?id|action.?id|running.?action.?id/i.test(key)
            ? "[oculto]"
            : redact(child),
        ]));
      };
      return JSON.stringify(redact(envelope)).slice(0, 1200);
    }

    function unwrapStreamerBotMessage(message) {
      if (message?.event && typeof message.event === "object") {
        const source = String(message.event.source ?? "").toLowerCase();
        const type = String(message.event.type ?? "").toLowerCase();
        if (source !== "general" || type !== "custom") return null;

        let payload = message.data;
        if (typeof payload === "string") payload = JSON.parse(payload);
        if (payload && (payload.event === "gift" || payload.event === "like")) return payload;
        payload = payload?.data ?? payload;
        if (typeof payload === "string") payload = JSON.parse(payload);
        if (payload && (payload.event === "gift" || payload.event === "like")) return payload;
        if (payload?.args && typeof payload.args === "object" && !payload.event) payload = payload.args;
        if (typeof payload?.args === "string" && !payload.event) payload = JSON.parse(payload.args);
        return payload && (payload.event === "gift" || payload.event === "like") ? payload : null;
      }
      return message?.event === "gift" || message?.event === "like" ? message : null;
    }

    function describeEvent(envelope, result) {
      const eventName = String(envelope?.event ?? "desconhecido");
      let summary = `Evento: ${eventName}`;
      if (eventName === "gift") {
        summary += ` → ${result.kind}`;
        if (result.reason) summary += ` (${result.reason})`;
        if (result.kind === "low-value") summary += ` | acumulado ${result.accumulated} | blocos +${result.blocksAdded}`;
        if (result.kind === "high-priority") summary += ` | pausa prioritária`;
      }
      if (eventName === "like" && result.kind === "like-progress") summary += ` → +${result.added} curtidas | total ${result.total} | metas +${result.alertsAdded}`;
      const snapshot = controller.snapshot();
      summary += ` | fila ${snapshot.pendingBlocks}`;
      if (snapshot.current) summary += ` | exibindo ${snapshot.current.senderName}`;
      if (debugMode) summary += `\nMensagem recebida: ${safeDiagnostic(envelope)}`;
      recentEvents.unshift(summary);
      recentEvents.length = Math.min(recentEvents.length, 2);
      setStatus(testMode ? "Teste local ativo — sem presentes reais." : "Streamer.bot conectado.");
    }

    function simulateGift(senderId, senderName, repeatCount, diamondCount = 1, giftName = "Rosa") {
      const envelope = {
        event: "gift",
        data: {
          gift: { id: `test-${giftName}`, name: giftName, diamondCount, type: 0 },
          repeatCount,
          user: { uniqueId: senderId, nickname: senderName },
        },
      };
      const result = controller.handleEnvelope(envelope);
      describeEvent(envelope, result);
      render();
    }

    function simulateLikes(likeCount) {
      const envelope = { event: "like", data: { likeCount, user: { uniqueId: "tap-teste", nickname: "Pessoa Tap Tap" } } };
      const result = controller.handleEnvelope(envelope);
      describeEvent(envelope, result);
      render();
    }

    function connect() {
      if (previewMode || testMode || socket?.readyState === WebSocket.CONNECTING || socket?.readyState === WebSocket.OPEN) return;
      setStatus("Conectando ao Streamer.bot local…");
      try {
        socket = new WebSocket("ws://127.0.0.1:8080/");
      } catch {
        setStatus("Não foi possível iniciar o WebSocket local.");
        scheduleReconnect();
        return;
      }
      socket.addEventListener("open", () => {
        socket.send(JSON.stringify({
          request: "Subscribe",
          id: "guardiao-rosa-overlay",
          events: { general: ["Custom"] },
        }));
        setStatus("Streamer.bot conectado; inscrição em General.Custom enviada.");
      });
      socket.addEventListener("message", ({ data }) => {
        try {
          const message = JSON.parse(String(data));
          const envelope = unwrapStreamerBotMessage(message);
          if (!envelope) {
            if (debugMode && message?.status === "ok" && message?.id === "guardiao-rosa-overlay") {
              recentEvents.unshift("Streamer.bot confirmou a inscrição em General.Custom.");
              recentEvents.length = Math.min(recentEvents.length, 2);
              setStatus("Streamer.bot conectado.");
            } else if (debugMode && !(message?.request === "Hello")) {
              recentEvents.unshift(`Mensagem WebSocket sem formato reconhecido: ${safeDiagnostic(message)}`);
              recentEvents.length = Math.min(recentEvents.length, 2);
              setStatus("Streamer.bot conectado.");
            }
            return;
          }
          const result = controller.handleEnvelope(envelope);
          describeEvent(envelope, result);
        } catch {
          recentEvents.unshift(`Mensagem JSON inválida: ${String(data).slice(0, 1200)}`);
          recentEvents.length = Math.min(recentEvents.length, 5);
          setStatus("Streamer.bot conectado.");
        }
      });
      socket.addEventListener("error", () => setStatus("Falha ao conectar. Verifique se o servidor WebSocket do Streamer.bot está iniciado."));
      socket.addEventListener("close", () => {
        setStatus("Desconectado; tentando reconectar…");
        scheduleReconnect();
      });
    }

    function scheduleReconnect() {
      if (reconnectTimer || previewMode) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connect();
      }, 3_000);
    }

    function renderQueue(nextAlerts) {
      const signature = JSON.stringify(nextAlerts.map((item) => [item.senderId, item.senderName, item.count, item.resumesAfterPriority]));
      if (signature === lastQueueSignature) return;
      lastQueueSignature = signature;
      queueList.replaceChildren();
      for (const [index, item] of nextAlerts.entries()) {
        const row = document.createElement("li");
        const number = document.createElement("span");
        number.className = "queue-number";
        number.textContent = String(index + 1).padStart(2, "0");
        const donor = document.createElement("span");
        donor.className = "queue-name";
        donor.textContent = item.senderName;
        if (item.resumesAfterPriority) donor.textContent += " (retoma)";
        const count = document.createElement("span");
        count.className = "queue-count";
        count.textContent = item.queueLabel;
        row.append(number, donor, count);
        queueList.append(row);
      }
      queuePanel.classList.toggle("visible", nextAlerts.length > 0);
    }

    function render() {
      const snapshot = controller.snapshot();
      const current = snapshot.current;
      renderQueue(snapshot.nextAlerts);
      if (!current) {
        card.classList.remove("visible");
        card.classList.remove("likes");
        lastId = null;
        return;
      }
      if (current.id !== lastId) {
        lastId = current.id;
        const isLikes = current.mode === "likes";
        card.classList.toggle("likes", isLikes);
        kicker.textContent = "A floresta agradece";
        name.textContent = current.senderName;
        message.textContent = current.text;
        if (current.giftIconUrl && !isLikes) {
          giftIcon.src = current.giftIconUrl;
          giftIcon.alt = current.giftName || "Presente";
          giftIcon.hidden = false;
          giftFallback.hidden = true;
        } else {
          giftIcon.removeAttribute("src");
          giftIcon.hidden = true;
          giftFallback.textContent = isLikes ? "💛" : (current.fallbackEmoji || "🎁");
          giftFallback.hidden = false;
        }
        card.classList.remove("visible");
        void card.offsetWidth;
        card.classList.add("visible");
      }
    }

    if (testMode) {
      testTools.classList.add("visible");
      setStatus("Teste local ativo — Event API não utilizada.");
      document.getElementById("test-15").addEventListener("click", () => {
        for (let i = 0; i < 15; i += 1) simulateGift("ana-teste", "Ana (teste)", 1);
      });
      document.getElementById("test-30").addEventListener("click", () => simulateGift("ana-teste", "Ana (teste)", 30));
      document.getElementById("test-round-robin").addEventListener("click", () => {
        simulateGift("ana-teste", "Ana (teste)", 30);
        simulateGift("joao-teste", "João (teste)", 15);
      });
      document.getElementById("test-likes").addEventListener("click", () => simulateLikes(1_000));
      document.getElementById("test-priority").addEventListener("click", () => simulateGift("prioridade-teste", "Presente prioritário (teste)", 1, 100));
      document.getElementById("test-reset").addEventListener("click", () => window.location.reload());
      setInterval(render, 100);
    } else if (previewMode) {
      name.textContent = "Prévia visual";
      message.textContent = "15 presentes de 1 diamante";
      card.classList.add("visible");
    } else {
      connect();
      setInterval(render, 100);
    }

    window.addEventListener("beforeunload", () => {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      socket?.close();
    });
  </script>
</body>
</html>
