<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Guardião da Floresta — presentes</title>
  <style>
    :root { font-family: "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
    body { display: grid; place-items: center; }
    #alert { width: min(92vw, 760px); min-height: 136px; padding: 20px 70px; position: relative; overflow: hidden; border: 2px solid rgba(148, 255, 174, .88); border-radius: 26px; color: #f2fff1; background: linear-gradient(110deg, rgba(5, 38, 25, .94), rgba(10, 87, 54, .92) 54%, rgba(25, 103, 61, .9)); box-shadow: 0 0 28px rgba(48, 255, 120, .34), inset 0 0 26px rgba(124, 255, 157, .1); text-align: center; opacity: 0; transform: translateY(18px) scale(.96); transition: opacity .22s ease, transform .22s ease; }
    #alert.visible { opacity: 1; transform: translateY(0) scale(1); }
    #alert::before, #alert::after { content: ""; position: absolute; width: 130px; height: 130px; border: 1px solid rgba(158, 255, 174, .25); border-radius: 50%; }
    #alert::before { top: -75px; left: -44px; }
    #alert::after { bottom: -94px; right: -33px; }
    .kicker { margin: 0 0 8px; color: #a7f3b5; font-size: 15px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .name { margin: 0; font-size: clamp(24px, 4vw, 38px); font-weight: 800; line-height: 1.12; text-shadow: 0 2px 10px rgba(0, 0, 0, .55); }
    .message { margin: 8px 0 0; color: #e0ffd9; font-size: clamp(18px, 2.8vw, 26px); font-weight: 650; }
    .leaf { position: absolute; top: 50%; transform: translateY(-50%); font-size: 40px; filter: drop-shadow(0 0 8px rgba(161, 255, 156, .6)); }
    .leaf.left { left: 13px; }
    .leaf.right { right: 13px; }
    #status { display: none; position: fixed; z-index: 10; left: 8px; top: 8px; max-width: min(92vw, 520px); padding: 8px 10px; border-radius: 8px; color: #fff; background: rgba(15, 20, 18, .92); font: 12px/1.45 "Segoe UI", Arial, sans-serif; white-space: pre-line; }
    #status.visible { display: block; }
  </style>
</head>
<body>
  <section id="alert" aria-live="polite" aria-atomic="true">
    <span class="leaf left" aria-hidden="true">🌿</span>
    <span class="leaf right" aria-hidden="true">🍃</span>
    <p class="kicker">A floresta agradece</p>
    <p class="name" id="name"></p>
    <p class="message" id="message"></p>
  </section>
  <div id="status" role="status"></div>
  <script type="module">
    import { RoseQueueController } from "./core.mjs";

    const settings = {
      blockSize: 15,
      lowDiamondValue: 1,
      highPriorityMinDiamonds: 100,
      highPriorityPauseMs: 10_000,
      alertDurationMs: 3_000,
    };
    const controller = new RoseQueueController(settings);
    const card = document.getElementById("alert");
    const name = document.getElementById("name");
    const message = document.getElementById("message");
    const status = document.getElementById("status");
    const params = new URLSearchParams(window.location.search);
    const previewMode = params.get("preview") === "1";
    const debugMode = params.get("debug") === "1";
    let lastId = null;
    let socket = null;
    let reconnectTimer = null;
    const recentEvents = [];

    function setStatus(text) {
      if (!debugMode) return;
      status.textContent = [text, ...recentEvents].join("\n");
      status.classList.add("visible");
    }

    function describeEvent(envelope, result) {
      const eventName = String(envelope?.event ?? "desconhecido");
      let summary = `Evento: ${eventName}`;
      if (eventName === "gift") {
        summary += ` → ${result.kind}`;
        if (result.reason) summary += ` (${result.reason})`;
        if (result.kind === "low-value") summary += ` | acumulado ${result.accumulated} | blocos +${result.blocksAdded}`;
        if (result.kind === "high-priority") summary += ` | pausa prioritária`;
      }
      const snapshot = controller.snapshot();
      summary += ` | fila ${snapshot.pendingBlocks}`;
      if (snapshot.current) summary += ` | exibindo ${snapshot.current.senderName}`;
      recentEvents.unshift(summary);
      recentEvents.length = Math.min(recentEvents.length, 5);
      setStatus("TikFinity conectado.");
    }

    function connect() {
      if (previewMode || socket?.readyState === WebSocket.CONNECTING || socket?.readyState === WebSocket.OPEN) return;
      setStatus("Conectando ao TikFinity local…");
      try {
        socket = new WebSocket("ws://127.0.0.1:21213/");
      } catch {
        setStatus("Não foi possível iniciar o WebSocket local.");
        scheduleReconnect();
        return;
      }
      socket.addEventListener("open", () => setStatus("TikFinity conectado."));
      socket.addEventListener("message", ({ data }) => {
        try {
          const envelope = JSON.parse(String(data));
          const result = controller.handleEnvelope(envelope);
          describeEvent(envelope, result);
        } catch {
          recentEvents.unshift("Mensagem recebida inválida; aguardando próximo evento.");
          recentEvents.length = Math.min(recentEvents.length, 5);
          setStatus("TikFinity conectado.");
        }
      });
      socket.addEventListener("error", () => setStatus("Falha no WebSocket. Verifique a permissão de rede local."));
      socket.addEventListener("close", () => {
        setStatus("Desconectado; tentando reconectar…");
        scheduleReconnect();
      });
    }

    function scheduleReconnect() {
      if (reconnectTimer || previewMode) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connect();
      }, 3_000);
    }

    function render() {
      const current = controller.snapshot().current;
      if (!current) {
        card.classList.remove("visible");
        lastId = null;
        return;
      }
      if (current.id !== lastId) {
        lastId = current.id;
        name.textContent = current.senderName;
        message.textContent = current.text;
        card.classList.add("visible");
      }
    }

    if (previewMode) {
      name.textContent = "Prévia visual";
      message.textContent = "15 presentes de 1 diamante";
      card.classList.add("visible");
    } else {
      connect();
      setInterval(render, 100);
    }

    window.addEventListener("beforeunload", () => {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      socket?.close();
    });
  </script>
</body>
</html>
